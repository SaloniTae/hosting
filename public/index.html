<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Castoor - Stream</title>
<script>
window['__onGCastApiAvailable'] = function(isAvailable) {
  log(isAvailable ? 'Cast SDK ready ✓' : 'Cast SDK unavailable', isAvailable?'ok':'err');
  if (!isAvailable) { setStatus('Cast unavailable','error'); return; }
  initCast();
};
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070d;--s:#0f0f1a;--b:#1a1a2e;--b2:#252540;
  --a:#7c6aff;--adim:#7c6aff18;--t:#eeeef8;--m:#7070a0;
  --ok:#22d47e;--err:#ff5e5e;--warn:#f59e0b;
  --ap:#fc3c44;
}
html,body{min-height:100dvh;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:14px;}

.hdr{display:flex;align-items:center;justify-content:space-between;}
.brand{font-size:22px;font-weight:700;letter-spacing:-.04em;}
.brand span{color:var(--a);}

#cast-trigger{display:flex;align-items:center;gap:6px;background:var(--s);border:1px solid var(--b);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--m);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;border:none;font-family:system-ui,sans-serif;}
#cast-trigger.ready{border:1px solid var(--a);color:var(--a);}
#cast-trigger.airplay{border:1px solid var(--ap);color:var(--ap);}
#cast-trigger svg{width:16px;height:16px;flex-shrink:0;}

.status{display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--b);border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--m);transition:all .3s;}
.status.connected{border-color:var(--ok);color:var(--t);}
.status.casting{border-color:var(--a);background:var(--adim);color:var(--t);}
.status.airplaying{border-color:var(--ap);background:#fc3c4415;color:var(--t);}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--b2);flex-shrink:0;transition:background .3s;}
.connected .sdot{background:var(--ok);}
.casting .sdot,.airplaying .sdot{background:var(--a);animation:pulse 1.2s infinite;}
.airplaying .sdot{background:var(--ap);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px;}
.ctitle{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--m);margin-bottom:12px;display:flex;justify-content:space-between;}

textarea#url{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:11px 13px;font-size:12px;font-family:'Courier New',monospace;color:var(--t);outline:none;resize:none;height:80px;line-height:1.4;transition:border-color .2s;}
textarea#url:focus{border-color:var(--a);}
textarea#url::placeholder{color:var(--m);}

.track-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
select.track-sel{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:10px;font-size:13px;color:var(--t);outline:none;appearance:none;cursor:pointer;font-family:system-ui;}
select.track-sel:focus{border-color:var(--a);}

.btn-detect{background:var(--b2);color:var(--t);border:none;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;}
.btn-detect:active{transform:scale(0.95);}

.btn-cast{width:100%;padding:15px;background:var(--a);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;letter-spacing:-.01em;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;}
.btn-cast:active{transform:scale(.97);opacity:.85;}
.btn-cast:disabled{background:var(--b);color:var(--m);cursor:not-allowed;transform:none;}
.btn-cast.airplay-mode{background:var(--ap);}

.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.btn-c{padding:12px 8px;background:var(--bg);border:1px solid var(--b);border-radius:10px;color:var(--m);font-size:13px;cursor:pointer;transition:all .15s;text-align:center;border:none;}
.btn-c:active{background:var(--b2);color:var(--t);}

.vrow{display:flex;align-items:center;gap:12px;}
.vlbl{font-size:12px;color:var(--m);min-width:40px;}
input[type=range]{flex:1;appearance:none;height:4px;border-radius:4px;background:var(--b2);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--a);cursor:pointer;}

#airplay-video{display:none;width:1px;height:1px;position:fixed;bottom:0;left:0;opacity:0;pointer-events:none;}
#log{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px 14px;font-size:11px;font-family:monospace;color:var(--m);max-height:150px;overflow-y:auto;line-height:1.9;}
.lt{color:#2a2a45;margin-right:6px;}
.lok{color:var(--ok);}.lerr{color:var(--err);}.linfo{color:var(--a);}.lwarn{color:var(--warn);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand">Cast<span>oor</span></div>
    <button id="cast-trigger" onclick="triggerCast()">
      <svg id="trigger-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5c-1.1 0-2 .9-2 2v3h2v-3h14v10h-5v2h5c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-18 3v2c.93 0 1.78.28 2.5.75l1.45-1.45C3.96 10.5 2.56 10 1 10z"/></svg>
      <span id="cast-trigger-label">Loading...</span>
    </button>
  </div>

  <div class="status" id="status">
    <div class="sdot"></div>
    <span id="stext">Detecting device...</span>
  </div>

  <!-- Direct URL Input -->
  <div class="card">
    <div class="ctitle">
      <span>Stream Source (Direct URL)</span>
    </div>
    <textarea id="url" placeholder="Paste direct .mkv, .mp4, or .m3u8 URL here..."></textarea>
    
    <div class="track-grid">
      <div class="ctitle" style="margin-bottom:0;">
        <span>Tracks & Quality</span>
        <button class="btn-detect" onclick="detectClientTracks()">Scan HLS Tracks</button>
      </div>
      <div style="font-size:10px;color:var(--m);margin-bottom:4px;">
        *MKV/MP4 tracks will automatically populate below after you click 'Cast to TV'. HLS tracks can be scanned before casting.
      </div>
      <select class="track-sel" id="audio-sel" onchange="updateCastTracks()">
        <option value="">Audio: Default / Auto</option>
      </select>
      <select class="track-sel" id="sub-sel" onchange="updateCastTracks()">
        <option value="">Subtitle: None / Default</option>
      </select>
      <select class="track-sel" id="qual-sel" onchange="updateCastTracks()">
        <option value="">Quality: Auto / Highest</option>
      </select>
    </div>

    <button class="btn-cast" id="btn-cast" disabled onclick="castStream()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5c-1.1 0-2 .9-2 2v3h2v-3h14v10h-5v2h5c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-18 3v2c.93 0 1.78.28 2.5.75l1.45-1.45C3.96 10.5 2.56 10 1 10z"/></svg>
      <span id="btn-cast-label">Cast to TV</span>
    </button>
  </div>

  <div class="card">
    <div class="ctitle">Playback Controls</div>
    <div class="cgrid">
      <button class="btn-c" id="btn-play" disabled onclick="ctrlPlay()">▶ Play</button>
      <button class="btn-c" id="btn-pause" disabled onclick="ctrlPause()">⏸ Pause</button>
      <button class="btn-c stop" id="btn-stop" disabled onclick="ctrlStop()">■ Stop</button>
    </div>
    <div class="vrow">
      <span class="vlbl">Volume</span>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" disabled oninput="ctrlVol(this)"/>
    </div>
  </div>

  <div id="log"><span class="lt">--:--</span><span class="linfo">Ready for URL.</span></div>
</div>

<video id="airplay-video" playsinline webkit-playsinline x-webkit-airplay="allow" preload="none"></video>

<script>
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const $=id=>document.getElementById(id);
let hlsInstance = null;
let currentCastMediaSession = null;

function log(msg,t='info'){
  const el=$('log'),now=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML+=`\n<span class="lt">${now}</span><span class="l${t}">${msg}</span>`;
  el.scrollTop=el.scrollHeight;
}
function setStatus(txt,cls=''){
  $('status').className='status '+cls;
  $('stext').textContent=txt;
}
function setControls(on){
  ['btn-play','btn-pause','btn-stop','vol'].forEach(id=>$(id).disabled=!on);
}
function detectContentType(url){
  if(url.includes('.m3u8')) return 'application/x-mpegURL';
  if(url.includes('.mpd')) return 'application/dash+xml';
  if(url.includes('.mkv')) return 'video/x-matroska';
  return 'video/mp4';
}

// ── 1. PRE-CAST HLS TRACK DETECTION ─────────────────────────────────────────
function detectClientTracks() {
  const url = $('url').value.trim();
  if(!url) { log('Enter a URL first to detect tracks', 'warn'); return; }
  
  if(!url.includes('.m3u8')) {
    log('Client track detection is only for HLS (.m3u8). MKV/MP4 tracks will detect automatically after you click Cast.', 'warn');
    return;
  }

  if (Hls.isSupported()) {
    log('Scanning HLS manifest for tracks...', 'info');
    if(hlsInstance) hlsInstance.destroy();
    
    hlsInstance = new Hls();
    hlsInstance.loadSource(url);
    
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
      log(`Found HLS Tracks: ${data.levels.length} Qualities`, 'ok');
      
      // Populate Quality
      $('qual-sel').innerHTML = '<option value="">Quality: Auto</option>';
      data.levels.forEach((level, index) => {
        $('qual-sel').innerHTML += `<option value="${index}">${level.height}p (${Math.round(level.bitrate/1000)} kbps)</option>`;
      });

      // Populate Audio
      $('audio-sel').innerHTML = '<option value="">Audio: Default</option>';
      if(hlsInstance.audioTracks && hlsInstance.audioTracks.length > 0) {
        hlsInstance.audioTracks.forEach((track, index) => {
          $('audio-sel').innerHTML += `<option value="${index}">${track.name || track.lang || 'Track '+index}</option>`;
        });
      }

      // Populate Subtitles
      $('sub-sel').innerHTML = '<option value="">Subtitle: None</option>';
      if(hlsInstance.subtitleTracks && hlsInstance.subtitleTracks.length > 0) {
        hlsInstance.subtitleTracks.forEach((track, index) => {
          $('sub-sel').innerHTML += `<option value="${index}">${track.name || track.lang || 'Sub '+index}</option>`;
        });
      }
    });

    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) log('Failed to parse HLS: ' + data.type, 'err');
    });
  } else {
    log('HLS parsing not supported in this browser.', 'err');
  }
}

// ── 2. POST-CAST CHROMECAST TRACK DETECTION ─────────────────────────────────
function parseChromecastTracks(mediaInfo) {
  if(!mediaInfo || !mediaInfo.tracks) {
    log('TV did not report any extra embedded tracks.', 'warn');
    return;
  }
  
  log('TV loaded media. Embedded tracks found!', 'ok');
  
  $('audio-sel').innerHTML = '<option value="">Audio: Default</option>';
  $('sub-sel').innerHTML = '<option value="">Subtitle: None</option>';
  
  let audioFound = false, subFound = false;

  mediaInfo.tracks.forEach(t => {
    let trackName = t.name || t.language || 'Track ' + t.trackId;
    if(t.type === 'AUDIO') {
      audioFound = true;
      $('audio-sel').innerHTML += `<option value="${t.trackId}">🔊 ${trackName}</option>`;
    } else if(t.type === 'TEXT') {
      subFound = true;
      $('sub-sel').innerHTML += `<option value="${t.trackId}">💬 ${trackName}</option>`;
    }
  });

  if(audioFound || subFound) log('Select tracks from the dropdowns to switch instantly.', 'info');
}

// ── 3. UPDATE CHROMECAST TRACKS ON-THE-FLY ─────────────────────────────────
function updateCastTracks() {
  if (isIOS) return; // iOS handles tracks natively in AirPlay menu
  
  if(!currentCastMediaSession) {
    log('Start casting first to change tracks.', 'warn');
    return;
  }

  const activeTrackIds = [];
  const aId = parseInt($('audio-sel').value);
  const sId = parseInt($('sub-sel').value);
  
  if(!isNaN(aId)) activeTrackIds.push(aId);
  if(!isNaN(sId)) activeTrackIds.push(sId);

  const request = new chrome.cast.media.EditTracksInfoRequest(activeTrackIds);
  currentCastMediaSession.editTracksInfo(request, 
    () => log('Tracks successfully updated on TV!', 'ok'),
    (err) => log('Failed to switch tracks: ' + (err.code || 'Unknown'), 'err')
  );
}

// ── CAST SETUP (CHROMECAST & AIRPLAY) ──────────────────────────────────────
const apVideo = $('airplay-video');

function setupAirPlay(){
  log('iOS detected — AirPlay mode','ok');
  const btn=$('cast-trigger');
  btn.className='';
  btn.style.cssText='display:flex;align-items:center;gap:6px;background:#fc3c4415;border:1px solid #fc3c44;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:#fc3c44;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:system-ui;';
  $('trigger-icon').innerHTML='<path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5l-1 1v1h10v-1l-1-1h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12H3V5h18v10z"/>';
  $('cast-trigger-label').textContent='AirPlay';
  $('btn-cast').disabled=false;
  $('btn-cast').classList.add('airplay-mode');
  setStatus('Tap "Cast to TV" for AirPlay');

  if(window.WebKitPlaybackTargetAvailabilityEvent){
    apVideo.addEventListener('webkitplaybacktargetavailabilitychanged', e=>{
      if(e.availability==='available') setStatus('AirPlay available','connected');
    });
  }

  apVideo.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', ()=>{
    if(apVideo.webkitCurrentPlaybackTargetIsWireless){
      log('✓ AirPlay started. Select tracks on iOS Lock Screen.','ok');
      setStatus('AirPlay casting...','airplaying');
      setControls(true);
    } else {
      setStatus('AirPlay disconnected');
      setControls(false);
    }
  });
}

function initCast(){
  const ctx=cast.framework.CastContext.getInstance();
  ctx.setOptions({
    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
    resumeSavedSession: true,
  });

  const btn=$('cast-trigger');
  btn.classList.add('ready');
  $('cast-trigger-label').textContent='Find TV';
  $('btn-cast').disabled=false;
  setStatus('Tap "Find TV" to pair device');

  ctx.addEventListener(
    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
    e=>{
      const S=cast.framework.SessionState;
      const session=ctx.getCurrentSession();
      switch(e.sessionState){
        case S.SESSION_STARTED:
        case S.SESSION_RESUMED:
          const dev=session.getCastDevice().friendlyName;
          log(`Connected to: ${dev}`,'ok');
          setStatus(`Connected — ${dev}`,'connected');
          btn.className='';
          btn.style.cssText='display:flex;align-items:center;gap:6px;background:#22d47e18;border:1px solid #22d47e;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:#22d47e;cursor:pointer;font-family:system-ui;';
          $('cast-trigger-label').textContent=dev;
          break;
        case S.SESSION_ENDED:
          setStatus('Disconnected');
          btn.style.cssText=''; btn.className='ready';
          $('cast-trigger-label').textContent='Find TV';
          setControls(false);
          currentCastMediaSession = null;
          break;
      }
    }
  );
}

function triggerCast(){
  if(isIOS){
    const url=$('url').value.trim();
    if(!url){ log('Enter URL first','err'); return; }
    apVideo.src=url; apVideo.load();
    if(apVideo.webkitShowPlaybackTargetPicker) apVideo.webkitShowPlaybackTargetPicker();
  } else {
    const ctx=cast.framework.CastContext.getInstance();
    const session=ctx.getCurrentSession();
    if(session) session.endSession(true);
    else ctx.requestSession().then(()=>log('Session paired','ok')).catch(e=>{});
  }
}

function castStream(){
  if(isIOS){ triggerCast(); return; }
  
  const url=$('url').value.trim();
  if(!url){ log('Enter URL','err'); return; }
  const session=cast.framework.CastContext.getInstance()?.getCurrentSession();
  if(!session){ log('Connect to TV first','err'); return; }
  
  const contentType=detectContentType(url);
  log(`Casting file...`,'info');
  
  const mediaInfo=new chrome.cast.media.MediaInfo(url,contentType);
  const request=new chrome.cast.media.LoadRequest(mediaInfo);
  request.autoplay=true;
  
  session.loadMedia(request).then(()=>{
    log('✓ Playing on TV','ok');
    setControls(true);
    currentCastMediaSession = session.getMediaSession();
    
    // As soon as media loads, parse tracks TV found!
    if(currentCastMediaSession && currentCastMediaSession.media) {
       parseChromecastTracks(currentCastMediaSession.media);
    }
  }).catch(err=>{
    log(`Failed to Cast. Check CORS. (${err})`,'err');
  });
}

function ctrlPlay(){ if(isIOS) apVideo.play(); else currentCastMediaSession?.play(null); }
function ctrlPause(){ if(isIOS) apVideo.pause(); else currentCastMediaSession?.pause(null); }
function ctrlStop(){ if(isIOS){ apVideo.pause(); apVideo.src=''; setControls(false); } else { cast.framework.CastContext.getInstance()?.getCurrentSession()?.getMediaSession()?.stop(null); setControls(false); } }
function ctrlVol(el){
  const v=parseFloat(el.value);
  if(isIOS) apVideo.volume=v;
  else cast.framework.CastContext.getInstance()?.getCurrentSession()?.setVolume(v);
}

(function init(){
  if(isIOS) setupAirPlay();
  else setStatus('Loading Cast SDK...');
})();
</script>
</body>
</html>
